<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaZi Calculator 八字</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>BaZi Calculator 八字命盘</h1>

  <button id="dark-toggle" class="dark-toggle" title="Toggle night mode" aria-label="Toggle night mode">🌙</button>

  <form id="input-form" onsubmit="return false;">
    <label>Name (optional)
      <input type="text" id="inp-name" placeholder="Optional">
    </label>
    <label>Gender
      <div class="sex-group">
        <label><input type="radio" name="sex" value="M" checked> Male</label>
        <label><input type="radio" name="sex" value="F"> Female</label>
      </div>
    </label>
    <div class="dob-row">
      <label>Hour
        <input type="time" id="inp-time" required>
      </label>
      <label>Day
        <input type="number" id="inp-day" min="1" max="31" required>
      </label>
      <label>Month
        <select id="inp-month" required>
          <option value="1">Jan</option>
          <option value="2">Feb</option>
          <option value="3">Mar</option>
          <option value="4">Apr</option>
          <option value="5">May</option>
          <option value="6">Jun</option>
          <option value="7">Jul</option>
          <option value="8">Aug</option>
          <option value="9">Sep</option>
          <option value="10">Oct</option>
          <option value="11">Nov</option>
          <option value="12">Dec</option>
        </select>
      </label>
      <label>Year
        <input type="number" id="inp-year" min="1900" max="2100" required>
      </label>
    </div>
    <label class="no-hour-row">
      <input type="checkbox" id="no-hour"> Unknown / No hour
    </label>
    <label style="grid-column:1/-1">Focus / Question (optional)
      <textarea id="inp-focus" rows="2" placeholder="What would you like to ask?" style="resize:vertical;padding:7px 10px;border:1px solid #ccc;border-radius:5px;font-size:.9rem;font-family:inherit"></textarea>
    </label>
    <button type="submit" id="calc-btn">Calculate 排命盘</button>
  </form>

  <div id="jie-warning">
    ⚠ Birth time is near a solar term boundary (節). The pillar may shift by one.
    Please verify the exact birth time.
  </div>

  <div id="copy-wrap" style="display:none">
    <button id="copy-btn">📋 Copy Prompt</button>
  </div>

  <div id="result"></div>

  <button id="help-fab" class="help-fab" title="Chart Glossary" aria-label="Chart Glossary">?</button>
  <div id="help-panel-overlay" class="help-overlay">
    <div class="help-panel">
      <div class="help-panel-header">
        <h2>Chart Glossary</h2>
        <button id="help-panel-close" class="help-panel-close" aria-label="Close">&times;</button>
      </div>
      <div id="help-panel-body" class="help-panel-body"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/tables.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/derived.js"></script>
  <script src="js/luck.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/glossary.js"></script>
  <script src="js/prompt.js"></script>
  <script src="js/render.js"></script>
  <script>
    let _navParams = null;

    function _adjustDate(params, component, delta) {
      const {year, month, day, hour, minute, sex} = params;
      const h = hour !== null ? hour : 12;
      const d = new Date(year, month - 1, day, h, minute || 0);
      if (component === 'year')  d.setFullYear(d.getFullYear() + delta);
      if (component === 'month') d.setMonth(d.getMonth() + delta);
      if (component === 'day')   d.setDate(d.getDate() + delta);
      if (component === 'hour')  d.setHours(d.getHours() + delta);
      return {
        year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate(),
        hour: hour !== null ? d.getHours() : null,
        minute: hour !== null ? d.getMinutes() : null,
        sex,
      };
    }

    function _doRender(params) {
      _navParams = params;
      const {year, month, day, hour, minute, sex} = params;
      try {
        const chart = computeChart(year, month, day, hour, minute !== null ? minute : 0, sex);
        renderChart(document.getElementById('result'), chart, (component, delta) => {
          const np = _adjustDate(_navParams, component, delta);
          document.getElementById('inp-day').value = np.day;
          document.getElementById('inp-month').value = np.month;
          document.getElementById('inp-year').value = np.year;
          if (np.hour !== null) {
            document.getElementById('inp-time').value =
              `${String(np.hour).padStart(2,'0')}:${String(np.minute || 0).padStart(2,'0')}`;
          }
          _doRender(np);
        });
        document.getElementById('copy-wrap').style.display = 'block';
        document.getElementById('copy-btn').onclick = () => {
          const name  = document.getElementById('inp-name').value.trim() || 'Seeker';
          const focus = document.getElementById('inp-focus').value.trim() || '';
          navigator.clipboard.writeText(generatePromptText(chart, name, focus))
            .then(() => {
              document.getElementById('copy-btn').textContent = '✅ Copied!';
              setTimeout(() => { document.getElementById('copy-btn').textContent = '📋 Copy Prompt'; }, 2000);
            })
            .catch(() => alert('Clipboard access denied. Try HTTPS or localhost.'));
        };
      } catch (e) {
        document.getElementById('result').innerHTML = `<p style="color:red">Error: ${e.message}</p>`;
        console.error(e);
      }
    }

    function _readFormAndRender() {
      const day   = Number(document.getElementById('inp-day').value);
      const month = Number(document.getElementById('inp-month').value);
      const year  = Number(document.getElementById('inp-year').value);
      const timeVal = document.getElementById('inp-time').value;
      const sex = document.querySelector('input[name="sex"]:checked').value;
      const noHour = document.getElementById('no-hour').checked;
      if (!day || !month || !year || (!timeVal && !noHour)) { alert('Please enter date and time.'); return; }
      if (year < 1900 || year > 2100) { alert('Year must be between 1900 and 2100.'); return; }
      const daysInMonth = new Date(year, month, 0).getDate();
      if (day < 1 || day > daysInMonth) { alert(`Day must be between 1 and ${daysInMonth} for the selected month.`); return; }
      const [hour, minute] = noHour ? [null, null] : timeVal.split(':').map(Number);
      _doRender({year, month, day, hour, minute, sex});
    }

    document.getElementById('calc-btn').addEventListener('click', _readFormAndRender);

    document.getElementById('no-hour').addEventListener('change', function() {
      const timeInput = document.getElementById('inp-time');
      timeInput.disabled = this.checked;
      timeInput.style.opacity = this.checked ? '0.4' : '1';
    });

    const helpOverlay = document.getElementById('help-panel-overlay');
    document.getElementById('help-fab').addEventListener('click', () => {
      const body = document.getElementById('help-panel-body');
      body.innerHTML = '';
      body.appendChild(buildHelpPanelContent());
      helpOverlay.classList.add('open');
    });
    document.getElementById('help-panel-close').addEventListener('click', () => {
      helpOverlay.classList.remove('open');
    });
    helpOverlay.addEventListener('click', (e) => {
      if (e.target === helpOverlay) helpOverlay.classList.remove('open');
    });

    // Apply saved night-mode preference first so pillar cell colors (baked
    // in as inline styles at render time) are correct on the very first
    // render below, and re-render on toggle so an already-rendered chart
    // picks up the new colors immediately.
    (function () {
      const darkToggle = document.getElementById('dark-toggle');
      const applyDarkMode = (on) => {
        document.documentElement.classList.toggle('dark-mode', on);
        darkToggle.textContent = on ? '☀️' : '🌙';
      };
      applyDarkMode(localStorage.getItem('darkMode') === '1');
      darkToggle.addEventListener('click', () => {
        const on = !document.documentElement.classList.contains('dark-mode');
        applyDarkMode(on);
        localStorage.setItem('darkMode', on ? '1' : '0');
        if (_navParams) _doRender(_navParams);
      });
    })();

    // Default to today's date/time and render immediately on page load.
    (function () {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('inp-day').value = now.getDate();
      document.getElementById('inp-month').value = now.getMonth() + 1;
      document.getElementById('inp-year').value = now.getFullYear();
      document.getElementById('inp-time').value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      _readFormAndRender();
    })();

    // Test mode: ?test=1
    if (location.search.includes('test=1')) {
      const cases = [
        { y:1985, mo:9, d:20, h:10, mi:0, sex:'M', label:'1985-09-20 10:00 M', expYear:'乙丑', expDay:'壬戌', expLP0:'甲申' },
        { y:1992, mo:3, d:15, h:23, mi:30, sex:'F', label:'1992-03-15 23:30 F (day roll)', expYear:'壬申', expDay:'辛卯', expLP0:'壬寅' },
        { y:1999, mo:1, d:15, h:12, mi:0, sex:'M', label:'1999-01-15 12:00 M (pre-LiChun)', expYear:'戊寅', expDay:'丁卯', expLP0:'丙寅' },
      ];
      const rows = cases.map(c => {
        const chart = computeChart(c.y, c.mo, c.d, c.h, c.mi, c.sex);
        const lp0 = luckPillars(chart, 1)[0];
        return {
          case: c.label,
          yearGZ: chart.year.stem + chart.year.branch,
          yearOK: c.expYear ? chart.year.stem + chart.year.branch === c.expYear : '–',
          dayGZ: chart.day.stem + chart.day.branch,
          dayOK: c.expDay ? chart.day.stem + chart.day.branch === c.expDay : '–',
          lp0GZ: lp0.stem + lp0.branch,
          lp0OK: c.expLP0 ? lp0.stem + lp0.branch === c.expLP0 : '–',
        };
      });
      console.table(rows);
      alert('Test results in console (F12).');
    }
  </script>
</body>
</html>
